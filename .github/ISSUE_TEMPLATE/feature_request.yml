name: Feature request
description: Suggest an improvement to TF Switcher.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem first, then the improvement you would like.
        Do not include confidential workplace information or credentials.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed experience
      description: Explain how the feature should work from a user's perspective.
    validations:
      required: true
  - type: dropdown
    id: audience
    attributes:
      label: Primary audience
      options:
        - Managed enterprise devices
        - Users who prefer a visual workflow
        - Terraform teams with multiple required versions
        - Extension administrators and support teams
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Current workaround or alternatives
  - type: checkboxes
    id: safety
    attributes:
      label: Sensitive information
      options:
        - label: I have removed credentials, tokens, private configuration, and other secrets.
          required: true
