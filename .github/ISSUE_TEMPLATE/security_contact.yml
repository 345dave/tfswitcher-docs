name: Security contact request
description: Request a private channel without publishing vulnerability details.
title: "[Security contact requested]"
labels:
  - security
body:
  - type: markdown
    attributes:
      value: |
        Do not include reproduction steps, exploit details, credentials, tokens,
        private configuration, or other sensitive information in this form.
  - type: input
    id: extension-version
    attributes:
      label: Affected TF Switcher version
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Not platform-specific
    validations:
      required: true
  - type: input
    id: contact
    attributes:
      label: Safe contact method
      description: Provide a safe way for the maintainer to contact you privately.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Public-information check
      options:
        - label: I have not included vulnerability details or sensitive information.
          required: true
